# Runs the tests (including the retrieval-quality floor) on every push and pull request.
# Not executed while building this project; check it on your first push.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m eval.run_eval
